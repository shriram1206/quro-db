version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0.42
    container_name: quro-db
    restart: always
    environment:
      MYSQL_DATABASE: quro_db
      MYSQL_ROOT_PASSWORD: Quro@123
    ports:
      - "3306:3306"
    volumes:
      - mysql-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pQuro@123"]
      timeout: 5s
      retries: 5
      interval: 10s

  # Quro AI Database Assistant Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quro-app
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/quro_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Quro@123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - DEMO_MODE=true # Set to false to enable production API calls
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-db-data:
